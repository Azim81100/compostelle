<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Un jour à la fois — Compostelle</title><style>body{margin:0;background:#f7f4ec;color:#293b31;font:17px system-ui}main,header{max-width:1000px;margin:auto;padding:24px}h1,h2{font-family:Georgia;font-weight:normal}h1{font-size:clamp(42px,7vw,80px);margin:20px 0}small{letter-spacing:2px}section,article{background:white;border-radius:16px;padding:24px;margin:20px 0}svg{width:100%;height:auto;background:#e3eadc;border-radius:12px}button{cursor:pointer;border:1px solid #b8c5b5;background:white;padding:8px;border-radius:8px;color:inherit}button:focus{outline:2px solid #426747}.stages{display:flex;flex-wrap:wrap;gap:8px}.photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.photos img{width:100%;border-radius:8px}p{line-height:1.65;white-space:pre-wrap}footer{text-align:center;padding:24px;color:#657466}</style></head><body><header><small>ARLES · COMPOSTELLE · 2027</small><h1>Un jour à la fois.</h1><p>Un chemin, des rencontres, des paysages. Mon journal de bord vers Saint-Jacques-de-Compostelle.</p></header><main><section><h2>Sur le chemin</h2><p id="progress">Départ à venir</p><svg id="map" viewBox="0 0 720 300" role="img" aria-label="Schéma provisoire du parcours"></svg><p><small>PARCOURS SCHÉMATIQUE — ÉTAPES PROVISOIRES</small></p><div class="stages" id="stages"></div></section><h2>Mon journal de bord</h2><div id="journal">Le voyage n'a pas encore commencé.</div></main><footer>Un jour à la fois · 2027</footer><script>const stages=['Arles','Saint-Gilles','Vauvert','Montpellier','Saint-Guilhem-le-Désert','Lodève','Lunas','Saint-Gervais-sur-Mare','Murat-sur-Vèbre','La Salvetat-sur-Agout','Anglès','Castres','Dourgne','Revel','Castelnaudary','Toulouse','L’Isle-Jourdain','Gimont','Auch','Montesquiou','Marciac','Maubourguet','Morlaàs','Lescar','Oloron-Sainte-Marie','Mauléon-Licharre','Saint-Jean-Pied-de-Port','Roncevaux','Pampelune','Puente la Reina','Estella','Los Arcos','Logroño','Nájera','Santo Domingo de la Calzada','Belorado','Burgos','Hornillos del Camino','Castrojeriz','Frómista','Carrión de los Condes','Sahagún','León','Hospital de Órbigo','Astorga','Rabanal del Camino','Ponferrada','Villafranca del Bierzo','O Cebreiro','Triacastela','Sarria','Portomarín','Palas de Rei','Arzúa','O Pedrouzo','Saint-Jacques-de-Compostelle'];const el=id=>document.getElementById(id);const ns='http://www.w3.org/2000/svg';function s(tag,a,t){let n=document.createElementNS(ns,tag);for(let k in a)n.setAttribute(k,a[k]);if(t)n.textContent=t;el('map').append(n);return n}function p(i){return [680-i*640/(stages.length-1),i<27?65+i*5:200+25*Math.sin(i/5)]}function render(entries){let last=entries.at(-1),idx=Math.max(0,stages.indexOf(last?.arrival));el('progress').textContent=last?'Dernière étape : '+last.arrival+' · '+entries.reduce((n,e)=>n+(Number(e.km)||0),0)+' km':'Départ à venir — Arles';s('polyline',{points:stages.map((_,i)=>p(i).join(',')).join(' '),fill:'none',stroke:'#a49e87','stroke-width':3,'stroke-dasharray':'5 5'});s('polyline',{points:stages.slice(0,idx+1).map((_,i)=>p(i).join(',')).join(' '),fill:'none',stroke:'#426747','stroke-width':4});stages.forEach((name,i)=>{let [x,y]=p(i);s('circle',{cx:x,cy:y,r:3,fill:i<=idx?'#426747':'#9b987d'});if([0,11,24,26,28,36,42,55].includes(i))s('text',{x,y:y-14,'font-size':11,'text-anchor':i===0?'end':i===55?'start':'middle',fill:'#293b31'},name);let b=document.createElement('button');b.textContent=name;b.onclick=()=>{let e=entries.find(e=>e.arrival===name);if(e)document.getElementById('day-'+e.day)?.scrollIntoView({behavior:'smooth'});else el('progress').textContent=name+' — Aucun récit publié pour cette étape.'};el('stages').append(b)});let [x,y]=p(idx);s('text',{x,y:y+9,'font-size':28,'text-anchor':'middle'},'🚶');if(entries.length)el('journal').replaceChildren();for(let e of [...entries].reverse()){let a=document.createElement('article');a.id='day-'+e.day;function add(tag,t){let n=document.createElement(tag);n.textContent=t;a.append(n)}add('h2','Jour '+e.day+' — '+e.arrival);add('small',e.date+' · '+e.km+' km');add('p',e.story);let g=document.createElement('div');g.className='photos';for(let src of (e.photos||[]).slice(0,3)){let im=document.createElement('img');im.src=src;im.alt='Photo du jour '+e.day;im.loading='lazy';g.append(im)}a.append(g);add('p','🍽 '+(e.meal||'Non renseigné')+'\n⛺ '+(e.sleep||'Non renseigné'));el('journal').append(a)}}fetch('journal.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(render).catch(()=>render([]));</script></body></html>
